<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cutline</title>
<style>
:root{--bg:#0e0f12;--panel:#16181d;--panel2:#1d2027;--line:#2a2e37;--fg:#e8e6e1;--mut:#8a8f9a;--acc:#ff6a3d;--acc2:#3dd6c6;--sel:#ffd23d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
#app{display:grid;grid-template-rows:44px 1fr 230px;grid-template-columns:1fr 290px;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:.12em;color:var(--acc);margin-right:14px}
button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:6px 11px;border-radius:5px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--acc);border-color:var(--acc);color:#140904;font-weight:600}
.sp{flex:1}#time{font-family:Consolas,monospace;color:var(--acc2);min-width:150px;text-align:center}
#stage{display:flex;align-items:center;justify-content:center;background:#08090b;position:relative;overflow:hidden}
#gl{max-width:96%;max-height:94%;aspect-ratio:16/9;background:#000;box-shadow:0 10px 40px #000a}
#empty{position:absolute;color:var(--mut);text-align:center;pointer-events:none}
#empty b{display:block;font-size:18px;color:var(--fg);margin-bottom:4px}
aside{background:var(--panel);border-left:1px solid var(--line);padding:14px;overflow:auto}
aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:4px 0 10px}
.row{margin-bottom:11px}.row label{display:flex;justify-content:space-between;color:var(--mut);margin-bottom:3px}
.row label span{color:var(--fg);font-family:Consolas,monospace}
input[type=range]{width:100%;accent-color:var(--acc)}
#tl{grid-column:1/3;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column}
#tlbar{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);color:var(--mut)}
#scroll{flex:1;overflow-x:auto;overflow-y:hidden;position:relative}
#track{position:relative;height:100%;min-width:100%}
#ruler{position:absolute;top:0;left:0;right:0;height:22px;border-bottom:1px solid var(--line)}
.tick{position:absolute;top:0;height:100%;border-left:1px solid var(--line);font-size:10px;color:var(--mut);padding-left:3px}
#lane{position:absolute;top:34px;left:0;height:110px}
.clip{position:absolute;top:0;height:100%;border-radius:6px;overflow:hidden;cursor:grab;border:2px solid transparent;background:linear-gradient(180deg,#2c4f6e,#1e3448)}
.clip.sel{border-color:var(--sel)}
.clip .name{position:absolute;left:10px;top:6px;right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:12px;text-shadow:0 1px 2px #000}
.clip .dur{position:absolute;left:10px;bottom:6px;font-size:11px;color:#cfe;opacity:.8}
.clip .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;background:#fff2}
.clip .h.l{left:0}.clip .h.r{right:0}
.clip .thumbs{position:absolute;inset:26px 0 22px 0;background-size:auto 100%;background-repeat:repeat-x;opacity:.55}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);pointer-events:none;z-index:5}
#ph::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top-color:var(--acc)}
#rec{display:none;position:absolute;top:12px;right:12px;background:#c0262688;padding:6px 12px;border-radius:4px;font-weight:600}
.hint{color:var(--mut);font-size:11px;margin-top:14px;line-height:1.7}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:10px}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">CUTLINE</span>
    <button id="bImport" class="primary">+ Import</button>
    <button id="bUndo">Undo</button><button id="bRedo">Redo</button>
    <button id="bSplit">Split</button><button id="bDup">Duplicate</button><button id="bDel">Delete</button>
    <div class="sp"></div>
    <button id="bStart">|&lt;</button><button id="bPlay">Play</button>
    <span id="time">00:00.00 / 00:00.00</span>
    <div class="sp"></div>
    <select id="res" style="background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:5px;border-radius:5px">
      <option value="1280x720">720p</option><option value="1920x1080">1080p</option><option value="854x480">480p</option>
    </select>
    <button id="bExport" class="primary">Export</button>
    <input id="file" type="file" accept="video/*" multiple hidden>
  </header>
  <div id="stage">
    <canvas id="gl" width="1280" height="720"></canvas>
    <div id="empty"><b>No clips yet</b>Import or drop video files to begin</div>
    <div id="rec">● EXPORTING</div>
  </div>
  <aside id="insp"></aside>
  <section id="tl">
    <div id="tlbar"><span>Timeline</span><div class="sp"></div><span>Zoom</span><input id="zoom" type="range" min="10" max="300" value="60" style="width:160px"></div>
    <div id="scroll"><div id="track"><div id="ruler"></div><div id="lane"></div><div id="ph"></div></div></div>
  </section>
</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 a;
uniform vec2 uScale;
varying vec2 v;
void main(){
  v = vec2(a.x*0.5+0.5, 0.5-a.y*0.5);
  gl_Position = vec4(a*uScale, 0.0, 1.0);
}
</script>
<script id="fs" type="x-shader/x-fragment">
precision mediump float;
varying vec2 v;
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uB, uC, uS, uH, uT, uV, uBlur, uO;
vec3 hueRot(vec3 c, float a){
  const vec3 k = vec3(0.57735);
  float ca = cos(a);
  return c*ca + cross(k,c)*sin(a) + k*dot(k,c)*(1.0-ca);
}
void main(){
  vec3 c = vec3(0.0);
  if (uBlur > 0.0) {
    float w = 0.0;
    for (int x=-3; x<=3; x++) for (int y=-3; y<=3; y++) {
      float g = exp(-float(x*x+y*y)/8.0);
      c += texture2D(uTex, v + vec2(float(x),float(y))*uTexel*uBlur).rgb * g;
      w += g;
    }
    c /= w;
  } else c = texture2D(uTex, v).rgb;
  c += uB;
  c = (c-0.5)*uC + 0.5;
  float l = dot(c, vec3(0.299,0.587,0.114));
  c = mix(vec3(l), c, uS);
  c = hueRot(c, uH);
  c += vec3(uT, uT*0.2, -uT)*0.12;
  float d = distance(v, vec2(0.5));
  c *= 1.0 - uV*smoothstep(0.25, 0.85, d);
  gl_FragColor = vec4(clamp(c,0.0,1.0)*uO, 1.0);
}
</script>
<script src="engine.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const PARAMS = [
  ["Brightness",-0.5,0.5,0.01],["Contrast",0,2,0.01],["Saturation",0,2,0.01],["Hue",-3.1416,3.1416,0.01],
  ["Temperature",-1,1,0.01],["Vignette",0,1,0.01],["Blur",0,6,0.05],["Fade in (s)",0,5,0.05],["Fade out (s)",0,5,0.05],["Volume",0,2,0.01]
];
let E, gl, prog, U = {}, tex;
const sources = []; // {name, video, gain, thumb}
let actx = null, adest = null;
let t = 0, playing = false, last = performance.now(), selected = -1, pps = 60;
let exporting = null;

EngineModule().then(m => { E = m; init(); });

function init(){
  initGL(); bindUI(); render(); requestAnimationFrame(frame);
}

/* ---------- WebGL / GLSL ---------- */
function initGL(){
  const c = $("gl");
  gl = c.getContext("webgl", {premultipliedAlpha:false, preserveDrawingBuffer:true});
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; };
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, $("vs").textContent));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, $("fs").textContent));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(prog, "a"); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  ["uScale","uTex","uTexel","uB","uC","uS","uH","uT","uV","uBlur","uO"].forEach(n => U[n] = gl.getUniformLocation(prog, n));
  tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]]
    .forEach(([k,v]) => gl.texParameteri(gl.TEXTURE_2D, k, v));
}

function draw(i, local){
  const c = $("gl");
  gl.viewport(0, 0, c.width, c.height);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  if (i < 0) return;
  const v = sources[E._eng_clip_src(i)].video;
  if (v.readyState < 2 || !v.videoWidth) return;
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, v);
  const va = v.videoWidth / v.videoHeight, ca = c.width / c.height;
  gl.uniform2f(U.uScale, va > ca ? 1 : va/ca, va > ca ? ca/va : 1);
  gl.uniform1i(U.uTex, 0);
  gl.uniform2f(U.uTexel, 1/v.videoWidth, 1/v.videoHeight);
  const p = k => E._eng_param_i(i, k);
  gl.uniform1f(U.uB, p(0)); gl.uniform1f(U.uC, p(1)); gl.uniform1f(U.uS, p(2)); gl.uniform1f(U.uH, p(3));
  gl.uniform1f(U.uT, p(4)); gl.uniform1f(U.uV, p(5)); gl.uniform1f(U.uBlur, p(6));
  gl.uniform1f(U.uO, E._eng_opacity(i, local));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------- Playback ---------- */
function frame(now){
  const dt = (now - last) / 1000; last = now;
  const dur = E._eng_duration();
  if (playing) {
    t += dt;
    if (t >= dur) { t = dur; setPlaying(false); if (exporting) finishExport(); }
  }
  const i = E._eng_locate(t), local = E._eng_q_local();
  sync(i);
  draw(i, local);
  $("ph").style.left = (t * pps) + "px";
  $("time").textContent = fmt(t) + " / " + fmt(dur);
  $("empty").style.display = E._eng_clip_count() ? "none" : "block";
  requestAnimationFrame(frame);
}

function sync(i){
  const active = i >= 0 ? E._eng_clip_src(i) : -1, srcT = E._eng_q_src();
  sources.forEach((s, k) => {
    if (k !== active) { if (!s.video.paused) s.video.pause(); s.gain.gain.value = 0; return; }
    const v = s.video;
    s.gain.gain.value = E._eng_param_i(i, 9) * E._eng_opacity(i, E._eng_q_local());
    const drift = Math.abs(v.currentTime - srcT);
    if (playing) {
      if (drift > 0.25 && !v.seeking) v.currentTime = srcT;
      if (v.paused) v.play().catch(()=>{});
    } else {
      if (!v.paused) v.pause();
      if (drift > 0.03 && !v.seeking) v.currentTime = srcT;
    }
  });
}

function setPlaying(p){
  if (p && !E._eng_clip_count()) return;
  if (p && t >= E._eng_duration() - 0.01) t = 0;
  playing = p; $("bPlay").textContent = p ? "Pause" : "Play";
  if (actx && actx.state === "suspended") actx.resume();
}

/* ---------- Import ---------- */
function ensureAudio(){
  if (actx) return;
  actx = new AudioContext(); adest = actx.createMediaStreamDestination();
}
function importFiles(files){
  ensureAudio();
  [...files].filter(f => f.type.startsWith("video") || /\.(mp4|webm|mkv|mov|ogv|m4v)$/i.test(f.name)).forEach(f => {
    const v = document.createElement("video");
    v.src = URL.createObjectURL(f); v.preload = "auto"; v.playsInline = true;
    v.addEventListener("loadedmetadata", () => {
      if (!isFinite(v.duration) || v.duration <= 0) { alert("Cannot read duration of " + f.name); return; }
      const node = actx.createMediaElementSource(v), gain = actx.createGain();
      node.connect(gain); gain.connect(actx.destination); gain.connect(adest);
      const sid = E._eng_add_source(v.duration);
      sources[sid] = {name: f.name, video: v, gain, thumb: ""};
      makeThumb(sid);
      const id = E._eng_add_clip(sid);
      selected = id; render();
    }, {once:true});
    v.addEventListener("error", () => alert("Unsupported video: " + f.name), {once:true});
  });
}
function makeThumb(sid){
  const v = document.createElement("video"); v.src = sources[sid].video.src; v.muted = true;
  v.addEventListener("loadeddata", () => { v.currentTime = Math.min(1, v.duration/3); }, {once:true});
  v.addEventListener("seeked", () => {
    const c = document.createElement("canvas"); c.height = 60; c.width = Math.round(60 * v.videoWidth / v.videoHeight) || 100;
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    sources[sid].thumb = c.toDataURL("image/jpeg", .7); render();
  }, {once:true});
}

/* ---------- Timeline UI ---------- */
function render(){
  const lane = $("lane"), n = E._eng_clip_count(), dur = E._eng_duration();
  lane.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const id = E._eng_clip_id(i), src = sources[E._eng_clip_src(i)];
    const st = E._eng_clip_start(i), l = E._eng_clip_out(i) - E._eng_clip_in(i);
    const d = document.createElement("div");
    d.className = "clip" + (id === selected ? " sel" : "");
    d.style.left = (st * pps) + "px"; d.style.width = Math.max(4, l * pps - 2) + "px";
    d.innerHTML = `<div class="thumbs" style="background-image:url('${src.thumb}')"></div><div class="name"></div><div class="dur">${l.toFixed(2)}s</div><div class="h l"></div><div class="h r"></div>`;
    d.querySelector(".name").textContent = src.name;
    d.addEventListener("pointerdown", e => clipDown(e, id, d));
    lane.appendChild(d);
  }
  const w = Math.max($("scroll").clientWidth, (dur + 10) * pps);
  $("track").style.width = w + "px"; lane.style.width = w + "px";
  const ruler = $("ruler"); ruler.innerHTML = "";
  const step = pps > 120 ? 1 : pps > 40 ? 2 : pps > 20 ? 5 : 10;
  for (let s = 0; s * pps < w; s += step) {
    const k = document.createElement("div"); k.className = "tick"; k.style.left = (s * pps) + "px"; k.textContent = fmt(s, true); ruler.appendChild(k);
  }
  renderInspector();
  $("bSplit").disabled = $("bDel").disabled = $("bDup").disabled = !n;
}

function clipDown(e, id, el){
  e.stopPropagation(); e.preventDefault();
  selected = id; renderInspector();
  document.querySelectorAll(".clip").forEach(c => c.classList.remove("sel")); el.classList.add("sel");
  const i = E._eng_index_of(id), in0 = E._eng_clip_in(i), out0 = E._eng_clip_out(i), x0 = e.clientX;
  const mode = e.target.classList.contains("l") ? "l" : e.target.classList.contains("r") ? "r" : "m";
  let moved = false;
  if (mode !== "m") E._eng_commit();
  const mv = ev => {
    const dx = ev.clientX - x0; if (Math.abs(dx) > 3) moved = true;
    if (mode === "l") { E._eng_trim(id, in0 + dx/pps, out0); render(); }
    else if (mode === "r") { E._eng_trim(id, in0, out0 + dx/pps); render(); }
    else { el.style.transform = `translateX(${dx}px)`; el.style.zIndex = 4; el.style.opacity = .85; }
  };
  const up = ev => {
    removeEventListener("pointermove", mv); removeEventListener("pointerup", up);
    if (mode === "m") {
      if (moved) {
        const center = (E._eng_clip_start(i) + (out0-in0)/2) * pps + (ev.clientX - x0);
        let to = 0; const n = E._eng_clip_count();
        for (let k = 0; k < n; k++) { if (k === i) continue;
          const c = (E._eng_clip_start(k) + (E._eng_clip_out(k)-E._eng_clip_in(k))/2) * pps; if (center > c) to++; }
        E._eng_move(id, to);
      } else seekTo(ev);
    }
    render();
  };
  addEventListener("pointermove", mv); addEventListener("pointerup", up);
}

function seekTo(ev){
  const r = $("track").getBoundingClientRect();
  t = Math.max(0, Math.min(E._eng_duration(), (ev.clientX - r.left) / pps));
}

function renderInspector(){
  const box = $("insp");
  if (E._eng_index_of(selected) < 0) { box.innerHTML = `<h3>Inspector</h3><p style="color:var(--mut)">Select a clip to adjust its look and sound.</p>${hints()}`; return; }
  const i = E._eng_index_of(selected);
  box.innerHTML = `<h3>Clip — ${esc(sources[E._eng_clip_src(i)].name)}</h3>` + PARAMS.map((p, k) => {
    const v = E._eng_get_param(selected, k);
    return `<div class="row"><label>${p[0]}<span id="pv${k}">${v.toFixed(2)}</span></label><input type="range" data-k="${k}" min="${p[1]}" max="${p[2]}" step="${p[3]}" value="${v}"></div>`;
  }).join("") + `<button id="bReset" style="width:100%">Reset effects</button>${hints()}`;
  box.querySelectorAll("input[type=range]").forEach(r => {
    r.addEventListener("pointerdown", () => E._eng_commit());
    r.addEventListener("keydown", e => e.stopPropagation());
    r.addEventListener("input", () => { const k = +r.dataset.k; E._eng_set_param(selected, k, +r.value); $("pv"+k).textContent = (+r.value).toFixed(2); });
  });
  $("bReset").onclick = () => { E._eng_reset_params(selected); render(); };
}
const hints = () => `<div class="hint"><kbd>Space</kbd> play · <kbd>S</kbd> split · <kbd>Del</kbd> delete · <kbd>D</kbd> duplicate<br><kbd>Ctrl+Z</kbd>/<kbd>Ctrl+Y</kbd> undo/redo · <kbd>←</kbd><kbd>→</kbd> step frame<br>Drag clips to reorder, drag edges to trim.</div>`;
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Export ---------- */
function startExport(){
  if (!E._eng_clip_count() || exporting) return;
  ensureAudio();
  const [w, h] = $("res").value.split("x").map(Number);
  const c = $("gl"); c.width = w; c.height = h;
  const stream = new MediaStream([...c.captureStream(30).getVideoTracks(), ...adest.stream.getAudioTracks()]);
  const mime = ["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"].find(m => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(stream, {mimeType: mime, videoBitsPerSecond: w >= 1920 ? 12e6 : 6e6});
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(chunks, {type:"video/webm"}));
    a.download = "cutline-export.webm"; a.click();
    $("rec").style.display = "none"; exporting = null; setBusy(false);
  };
  exporting = rec; setBusy(true); $("rec").style.display = "block";
  t = 0; setTimeout(() => { rec.start(250); setPlaying(true); }, 300);
}
function finishExport(){ setTimeout(() => exporting && exporting.state !== "inactive" && exporting.stop(), 300); }
function setBusy(b){ document.querySelectorAll("header button, header select").forEach(x => x.disabled = b); }

/* ---------- Bindings ---------- */
function act(fn){ if (exporting) return; fn(); render(); }
function bindUI(){
  $("bImport").onclick = () => $("file").click();
  $("file").onchange = e => { importFiles(e.target.files); e.target.value = ""; };
  $("bPlay").onclick = () => setPlaying(!playing);
  $("bStart").onclick = () => { t = 0; };
  $("bSplit").onclick = () => act(() => { const id = E._eng_split(t); if (id > 0) selected = id; });
  $("bDel").onclick = () => act(() => E._eng_delete(selected));
  $("bDup").onclick = () => act(() => { const id = E._eng_duplicate(selected); if (id > 0) selected = id; });
  $("bUndo").onclick = () => act(() => E._eng_undo());
  $("bRedo").onclick = () => act(() => E._eng_redo());
  $("bExport").onclick = startExport;
  $("zoom").oninput = e => { pps = +e.target.value; render(); };
  $("track").addEventListener("pointerdown", e => {
    seekTo(e);
    const mv = ev => seekTo(ev), up = () => { removeEventListener("pointermove", mv); removeEventListener("pointerup", up); };
    addEventListener("pointermove", mv); addEventListener("pointerup", up);
  });
  $("scroll").addEventListener("wheel", e => { if (e.ctrlKey) { e.preventDefault(); pps = Math.max(10, Math.min(300, pps * (e.deltaY < 0 ? 1.15 : 0.87))); $("zoom").value = pps; render(); } }, {passive:false});
  addEventListener("resize", render);
  addEventListener("dragover", e => e.preventDefault());
  addEventListener("drop", e => { e.preventDefault(); importFiles(e.dataTransfer.files); });
  addEventListener("keydown", e => {
    if (exporting) return;
    const k = e.key.toLowerCase();
    if (e.ctrlKey && k === "z") { e.preventDefault(); act(() => e.shiftKey ? E._eng_redo() : E._eng_undo()); }
    else if (e.ctrlKey && k === "y") { e.preventDefault(); act(() => E._eng_redo()); }
    else if (k === " ") { e.preventDefault(); setPlaying(!playing); }
    else if (k === "s") $("bSplit").click();
    else if (k === "d") $("bDup").click();
    else if (k === "delete" || k === "backspace") $("bDel").click();
    else if (k === "arrowleft") t = Math.max(0, t - 1/30);
    else if (k === "arrowright") t = Math.min(E._eng_duration(), t + 1/30);
    else if (k === "home") t = 0;
  });
}
function fmt(s, short){
  const m = Math.floor(s/60), r = s - m*60;
  return short ? `${m}:${String(Math.floor(r)).padStart(2,"0")}` : `${String(m).padStart(2,"0")}:${r.toFixed(2).padStart(5,"0")}`;
}
</script>
