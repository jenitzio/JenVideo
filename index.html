<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cutline</title>
<style>
:root{--bg:#0b0c0f;--panel:#14161b;--panel2:#1c1f26;--panel3:#242832;--line:#2a2e37;--fg:#ece9e3;--mut:#8a8f9a;--acc:#ff6a3d;--acc2:#3dd6c6;--sel:#ffd23d;--txt:#b07cff;--aud:#3dbf6e;--vid1:#2c4f6e;--vid2:#1e3448;--danger:#ff4d5e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
#app{display:grid;grid-template-rows:48px 1fr 300px;grid-template-columns:1fr 330px;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:5px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow:hidden}
.logo{font-weight:800;letter-spacing:.14em;color:var(--acc);margin-right:8px;font-size:14px}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
button,select,input[type=number],input[type=text],textarea{background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:6px 10px;border-radius:6px;font:inherit}
button{cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.35;cursor:default}
button.primary{background:var(--acc);border-color:var(--acc);color:#140904;font-weight:700}
button.on{background:var(--panel3);border-color:var(--acc2);color:var(--acc2)}
button.sm{padding:3px 8px;font-size:12px}
button.ghost{background:transparent}
select{padding:5px 6px}
textarea{width:100%;resize:vertical;min-height:64px;user-select:text}
input[type=number],input[type=text]{width:100%;user-select:text}
.sp{flex:1}
#time{font-family:Consolas,monospace;color:var(--acc2);min-width:170px;text-align:center;font-size:14px}
#vu{width:70px;height:10px;border-radius:3px;background:var(--panel2)}
#stage{display:flex;align-items:center;justify-content:center;background:#060709;position:relative;overflow:hidden}
#view{position:relative;box-shadow:0 10px 50px #000c;background:#000}
#view canvas#gl{width:100%;height:100%;display:block}
#guides{position:absolute;inset:0;pointer-events:none;display:none}
#guides .safe{position:absolute;inset:5%;border:1px dashed #ffffff55}
#guides .title{position:absolute;inset:10%;border:1px dashed #ffd23d55}
#grid{position:absolute;inset:0;pointer-events:none;display:none;background-image:linear-gradient(#ffffff22 1px,transparent 1px),linear-gradient(90deg,#ffffff22 1px,transparent 1px);background-size:33.333% 33.333%;background-position:-1px -1px}
#empty{position:absolute;color:var(--mut);text-align:center;pointer-events:none}
#empty b{display:block;font-size:20px;color:var(--fg);margin-bottom:6px}
#empty .rest{pointer-events:auto;margin-top:14px}
#stagebar{position:absolute;top:10px;right:10px;display:flex;gap:4px;z-index:3}
#scope{position:absolute;left:10px;top:10px;width:256px;height:110px;background:#000b;border:1px solid var(--line);border-radius:6px;display:none;z-index:3}
#drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#ff6a3d22;border:3px dashed var(--acc);font-size:22px;font-weight:700;z-index:20;pointer-events:none}
#prog{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(520px,80%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:none;z-index:6}
#prog .bar{height:8px;background:var(--panel3);border-radius:4px;overflow:hidden;margin:8px 0}
#prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--sel))}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px 14px 30px}
aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin:2px 0 10px;display:flex;align-items:center;gap:6px}
aside h3 .badge{background:var(--panel3);color:var(--fg);border-radius:4px;padding:1px 6px;letter-spacing:0;text-transform:none;font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--panel2)}
details>summary{cursor:pointer;padding:8px 10px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details>summary::after{content:"▾";color:var(--mut)}details:not([open])>summary::after{content:"▸"}
details>div{padding:4px 10px 10px}
.row{margin-bottom:9px}.row label{display:flex;justify-content:space-between;color:var(--mut);margin-bottom:3px;font-size:12px}
.row label span{color:var(--fg);font-family:Consolas,monospace}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:6px;color:var(--mut);margin:6px 0;font-size:12px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=color]{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:2px}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.looks button{padding:7px 4px;font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.btnrow button{flex:1}
#tl{grid-column:1/3;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tlbar{display:flex;gap:5px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line);color:var(--mut)}
#tlwrap{flex:1;display:flex;min-height:0}
#heads{width:46px;flex:none;position:relative;border-right:1px solid var(--line);background:var(--panel)}
#heads div{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--mut);border-bottom:1px solid #ffffff08}
#scroll{flex:1;overflow-x:auto;overflow-y:hidden;position:relative}
#track{position:relative;height:100%;min-width:100%}
#ruler{position:absolute;top:0;left:0;right:0;height:24px;border-bottom:1px solid var(--line);cursor:pointer}
.tick{position:absolute;top:0;height:100%;border-left:1px solid var(--line);font-size:10px;color:var(--mut);padding-left:3px;padding-top:3px}
.mark{position:absolute;top:12px;width:0;height:0;border:6px solid transparent;border-top-color:var(--sel);transform:translateX(-6px);cursor:pointer;z-index:4}
.markline{position:absolute;top:24px;bottom:0;width:1px;background:#ffd23d44;pointer-events:none}
.lanebg{position:absolute;left:0;right:0;background:#ffffff05;border-bottom:1px solid #ffffff08}
.clip,.item{position:absolute;border-radius:6px;overflow:hidden;cursor:grab;border:2px solid transparent}
.clip{background:linear-gradient(180deg,var(--vid1),var(--vid2))}
.clip.img{background:linear-gradient(180deg,#5a3f6e,#3a284a)}
.item.text{background:linear-gradient(180deg,#5b3d8f,#3f2a66)}
.item.audio{background:linear-gradient(180deg,#1f5a3a,#153d28)}
.clip.sel,.item.sel{border-color:var(--sel);z-index:3}
.clip canvas.film{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.6}
.clip canvas.wave,.item canvas.wave{position:absolute;left:0;bottom:0;width:100%;pointer-events:none}
.clip canvas.wave{height:18px;opacity:.8}.item canvas.wave{height:100%;opacity:.75}
.lbl{position:absolute;left:8px;top:4px;right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:11px;text-shadow:0 1px 2px #000;pointer-events:none}
.dur{position:absolute;right:8px;top:4px;font-size:10px;color:#cfe;opacity:.85;pointer-events:none;text-shadow:0 1px 2px #000}
.badges{position:absolute;left:8px;top:20px;display:flex;gap:3px;pointer-events:none}
.badges b{background:#000a;border-radius:3px;padding:0 4px;font-size:10px;color:var(--sel)}
.trans{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,#ffffff55,transparent);pointer-events:none}
.h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;background:#ffffff22;z-index:2}
.h.l{left:0}.h.r{right:0}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);pointer-events:none;z-index:8}
#ph::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top-color:var(--acc)}
.hint{color:var(--mut);font-size:11px;margin-top:14px;line-height:1.8}
kbd{background:var(--panel3);border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:10px;font-family:inherit}
#toasts{position:fixed;left:50%;bottom:316px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:50;pointer-events:none;align-items:center}
.toast{background:var(--panel3);border:1px solid var(--line);border-left:3px solid var(--acc2);padding:8px 14px;border-radius:8px;box-shadow:0 8px 30px #000a;animation:tin .2s ease-out}
.toast.err{border-left-color:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:18px 20px;width:440px;box-shadow:0 20px 80px #000}
dialog::backdrop{background:#0009}
dialog h2{font-size:16px;margin-bottom:12px}
dialog .row select,dialog .row input{width:100%}
.help{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12px;max-height:60vh;overflow:auto}
.help kbd{justify-self:start}
.stat{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin:3px 0}.stat b{color:var(--fg);font-weight:500}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">CUTLINE</span>
    <button id="bNew" title="New project">New</button>
    <button id="bOpen" title="Open project (Ctrl+O)">Open</button>
    <button id="bSave" title="Save project (Ctrl+S)">Save</button>
    <div class="sep"></div>
    <button id="bImport" class="primary" title="Import video, images, music, subtitles (I)">+ Import</button>
    <button id="bText" title="Add text (T)">+ Text</button>
    <div class="sep"></div>
    <button id="bUndo" title="Undo (Ctrl+Z)">↶</button><button id="bRedo" title="Redo (Ctrl+Y)">↷</button>
    <button id="bSplit" title="Split at playhead (S)">Split</button>
    <button id="bDup" title="Duplicate (D)">Duplicate</button>
    <button id="bDel" title="Delete (Del)">Delete</button>
    <button id="bFreeze" title="Freeze frame at playhead (Shift+F)">Freeze</button>
    <div class="sp"></div>
    <button id="bStart" class="ghost" title="Go to start (Home)">⏮</button>
    <button id="bPrev" class="ghost" title="Previous edit point (↑)">⏪</button>
    <button id="bPlay" title="Play / pause (Space)">▶ Play</button>
    <button id="bNext" class="ghost" title="Next edit point (↓)">⏩</button>
    <button id="bLoop" class="ghost" title="Loop playback">🔁</button>
    <span id="time">00:00.00 / 00:00.00</span>
    <canvas id="vu" width="70" height="10" title="Output level"></canvas>
    <div class="sp"></div>
    <button id="bHelp" class="ghost" title="Shortcuts (?)">?</button>
    <button id="bExport" class="primary" title="Export (Ctrl+E)">Export</button>
    <input id="file" type="file" accept="video/*,audio/*,image/*,.srt,.vtt,.json,.cutline" multiple hidden>
  </header>

  <div id="stage">
    <div id="view">
      <canvas id="gl" width="1280" height="720"></canvas>
      <div id="grid"></div>
      <div id="guides"><div class="safe"></div><div class="title"></div></div>
    </div>
    <div id="empty"><b>Drop media to start</b>Videos, photos, music and .srt subtitles — or click <b style="display:inline;font-size:13px;color:var(--acc)">+ Import</b><div class="rest" id="restoreBox"></div></div>
    <canvas id="scope" width="256" height="110"></canvas>
    <div id="stagebar">
      <button class="sm" id="bGuides" title="Safe-area guides">Safe</button>
      <button class="sm" id="bGrid" title="Rule-of-thirds grid">Grid</button>
      <button class="sm" id="bScope" title="RGB histogram">Scopes</button>
      <button class="sm" id="bSnap" title="Snapshot current frame as PNG">📷</button>
      <button class="sm" id="bFull" title="Fullscreen preview (F)">⛶</button>
    </div>
    <div id="prog"><div style="display:flex;justify-content:space-between"><b id="progT">Exporting…</b><span id="progP">0%</span></div><div class="bar"><i id="progBar"></i></div><div style="display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:12px"><span>Rendering in real time — keep Cutline open.</span><button class="sm" id="bCancelExp">Cancel</button></div></div>
    <div id="drop">Drop to import</div>
  </div>

  <aside id="insp"></aside>

  <section id="tl">
    <div id="tlbar">
      <button class="sm on" id="bMagnet" title="Snapping (N)">🧲 Snap</button>
      <button class="sm" id="bMark" title="Toggle marker at playhead (M)">◆ Marker</button>
      <button class="sm" id="bSplitMarks" title="Split video at every marker">Split at markers</button>
      <button class="sm" id="bClearMarks" title="Remove all markers">Clear markers</button>
      <div class="sp"></div>
      <span id="tlinfo"></span>
      <div class="sp"></div>
      <button class="sm" id="bFit" title="Zoom to fit (\)">Fit</button>
      <span>Zoom</span><input id="zoom" type="range" min="4" max="400" value="60" style="width:160px">
    </div>
    <div id="tlwrap">
      <div id="heads"></div>
      <div id="scroll"><div id="track"><div id="ruler"></div><div id="lanes"></div><div id="ph"></div></div></div>
    </div>
  </section>
</div>
<div id="toasts"></div>

<dialog id="dlgExport">
  <h2>Export</h2>
  <div class="row"><label>File name</label><input type="text" id="exName" value="cutline-export"></div>
  <div class="pair">
    <div class="row"><label>Format</label><select id="exFmt"></select></div>
    <div class="row"><label>Quality</label><select id="exQ"><option value="0.5">Small</option><option value="1" selected>Standard</option><option value="2">High</option><option value="4">Maximum</option></select></div>
  </div>
  <div class="pair">
    <div class="row"><label>Resolution</label><select id="exRes"><option>480</option><option>720</option><option selected>1080</option><option>1440</option><option>2160</option></select></div>
    <div class="row"><label>Frame rate</label><select id="exFps"><option>24</option><option>25</option><option selected>30</option><option>50</option><option>60</option></select></div>
  </div>
  <div class="stat"><span>Output size</span><b id="exInfo"></b></div>
  <div class="btnrow"><button class="primary" id="exGo">Export video</button></div>
  <div class="btnrow"><button id="exAudio">Audio only</button><button id="exPng">Current frame (PNG)</button><button id="exSrt">Subtitles (.srt)</button></div>
  <div class="btnrow"><button id="exClose" class="ghost">Close</button></div>
</dialog>

<dialog id="dlgHelp">
  <h2>Keyboard shortcuts</h2>
  <div class="help" id="helpList"></div>
  <div class="btnrow"><button onclick="this.closest('dialog').close()">Close</button></div>
</dialog>

<!-- ================= Shaders ================= -->
<script id="vsFx" type="x-shader/x-vertex">
attribute vec2 aPos; attribute vec2 aUV; varying vec2 v;
void main(){ v = aUV; gl_Position = vec4(aPos, 0.0, 1.0); }
</script>
<script id="fsFx" type="x-shader/x-fragment">
precision highp float;
varying vec2 v;
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uB,uC,uS,uH,uT,uTi,uV,uBlur,uSh,uGr,uPx,uAb,uSp,uO,uDark,uTime;
vec3 hueRot(vec3 c, float a){ const vec3 k = vec3(0.57735); float ca = cos(a); return c*ca + cross(k,c)*sin(a) + k*dot(k,c)*(1.0-ca); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
vec2 pix(vec2 p){ if (uPx > 0.5) { vec2 b = uTexel*uPx; return (floor(p/b)+0.5)*b; } return p; }
vec3 tap(vec2 p){
  p = pix(p);
  if (uAb > 0.0) { vec2 d = (p-0.5)*uAb*0.02; return vec3(texture2D(uTex,p+d).r, texture2D(uTex,p).g, texture2D(uTex,p-d).b); }
  return texture2D(uTex,p).rgb;
}
void main(){
  vec3 c = vec3(0.0);
  if (uBlur > 0.0) {
    float w = 0.0;
    for (int x=-3; x<=3; x++) for (int y=-3; y<=3; y++) {
      float g = exp(-float(x*x+y*y)/8.0);
      c += tap(v + vec2(float(x),float(y))*uTexel*uBlur) * g; w += g;
    }
    c /= w;
  } else c = tap(v);
  if (uSh > 0.0) {
    vec3 n = tap(v+vec2(uTexel.x,0.0)) + tap(v-vec2(uTexel.x,0.0)) + tap(v+vec2(0.0,uTexel.y)) + tap(v-vec2(0.0,uTexel.y));
    c += (c - n*0.25) * uSh * 2.0;
  }
  c += uB;
  c = (c-0.5)*uC + 0.5;
  float l = dot(c, vec3(0.299,0.587,0.114));
  c = mix(vec3(l), c, uS);
  c = hueRot(c, uH);
  c += vec3(uT, uT*0.2, -uT)*0.12;
  c += vec3(uTi*0.06, -uTi*0.1, uTi*0.06);
  l = clamp(dot(c, vec3(0.299,0.587,0.114)), 0.0, 1.0);
  c += uSp*0.12*mix(vec3(-0.5,0.12,0.45), vec3(0.55,0.18,-0.45), smoothstep(0.1,0.9,l));
  float d = distance(v, vec2(0.5));
  c *= 1.0 - uV*smoothstep(0.25, 0.85, d);
  if (uGr > 0.0) c += (hash(v*1024.0 + fract(uTime*7.13)*97.0) - 0.5) * uGr * 0.25;
  gl_FragColor = vec4(clamp(c,0.0,1.0)*uDark, uO);
}
</script>
<script id="vsQuad" type="x-shader/x-vertex">
attribute vec2 aPos; uniform float uFlip; varying vec2 v;
void main(){ v = vec2(aPos.x*0.5+0.5, uFlip > 0.5 ? 0.5-aPos.y*0.5 : aPos.y*0.5+0.5); gl_Position = vec4(aPos,0.0,1.0); }
</script>
<script id="fsComp" type="x-shader/x-fragment">
precision highp float;
varying vec2 v;
uniform sampler2D uA, uB;
uniform float uP, uType, uAsp;
vec4 A(vec2 p){ return (p.x<0.0||p.x>1.0||p.y<0.0||p.y>1.0) ? vec4(0.0,0.0,0.0,1.0) : texture2D(uA,p); }
vec4 B(vec2 p){ return (p.x<0.0||p.x>1.0||p.y<0.0||p.y>1.0) ? vec4(0.0,0.0,0.0,1.0) : texture2D(uB,p); }
void main(){
  float p = uP; int t = int(uType + 0.5); vec4 c;
  if (t == 0) c = B(v);
  else if (t == 1) c = mix(A(v), B(v), p);
  else if (t == 2) c = p < 0.5 ? A(v)*(1.0-p*2.0) : B(v)*((p-0.5)*2.0);
  else if (t == 3) c = p < 0.5 ? mix(A(v), vec4(1.0), p*2.0) : mix(vec4(1.0), B(v), (p-0.5)*2.0);
  else if (t == 4) c = mix(A(v), B(v), smoothstep(v.x-0.02, v.x+0.02, p*1.04-0.02));
  else if (t == 5) c = mix(A(v), B(v), smoothstep(v.y-0.02, v.y+0.02, p*1.04-0.02));
  else if (t == 6) { float e = p*p*(3.0-2.0*p); c = v.x < 1.0-e ? A(v+vec2(e,0.0)) : B(v-vec2(1.0-e,0.0)); }
  else if (t == 7) { vec4 a = A((v-0.5)/(1.0+p*1.5)+0.5); vec4 b = B((v-0.5)*(1.0+(1.0-p)*0.6)+0.5); c = mix(a, b, smoothstep(0.2,0.8,p)); }
  else { vec2 q = (v-0.5)*vec2(uAsp,1.0); float r = p*length(vec2(uAsp,1.0))*0.5; c = mix(A(v), B(v), smoothstep(r+0.01, r-0.01, length(q))); }
  gl_FragColor = vec4(c.rgb, 1.0);
}
</script>
<script id="fsBlit" type="x-shader/x-fragment">
precision mediump float; varying vec2 v; uniform sampler2D uTex;
void main(){ gl_FragColor = texture2D(uTex, v); }
</script>

<script src="engine.js"></script>
<script>
"use strict";
/* =====================================================================
   Cutline v2 — interface, renderer and media layer
   ===================================================================== */
const $ = id => document.getElementById(id);
const P = {BRIGHT:0,CONTRAST:1,SAT:2,HUE:3,TEMP:4,TINT:5,VIGN:6,BLUR:7,SHARP:8,GRAIN:9,PIXEL:10,ABERR:11,SPLIT:12,
  FADEIN:13,FADEOUT:14,VOLUME:15,SPEED:16,SCALE:17,POSX:18,POSY:19,ROT:20,FLIP:21,KB:22,FIT:23,BGBLUR:24,TRTYPE:25,TRDUR:26,OPACITY:27,COUNT:28};
const O = {X:0,Y:1,SIZE:2,COLOR:3,BG:4,BGCOLOR:5,BGOP:6,FONT:7,ANIM:8,ALIGN:9,OUTLINE:10,BOLD:11,LANE:12,SHADOW:13,COUNT:14};
const A = {VOL:0,FIN:1,FOUT:2,LANE:3,COUNT:4};
const FONTS = [["Sans","'Segoe UI',system-ui,sans-serif"],["Impact","Impact,'Arial Black',sans-serif"],["Serif","Georgia,'Times New Roman',serif"],["Mono","Consolas,'Courier New',monospace"],["Heavy","'Arial Black',Arial,sans-serif"],["Rounded","'Trebuchet MS',sans-serif"],["Casual","'Comic Sans MS',cursive"]];

function bgRGB(){ const n = unhex(proj.bg); return [((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255]; }

function uploadSource(s){

    gl.uniform1f(u.uBlur, blurOverride || p(P.BLUR)); gl.uniform1f(u.uSh, blurOverride ? 0 : p(P.SHARP));
    gl.uniform1f(u.uGr, p(P.GRAIN)); gl.uniform1f(u.uPx, blurOverride ? 0 : p(P.PIXEL)); gl.uniform1f(u.uAb, blurOverride ? 0 : p(P.ABERR));
    gl.uniform1f(u.uSp, p(P.SPLIT)); gl.uniform1f(u.uO, a); gl.uniform1f(u.uDark, dark); gl.uniform1f(u.uTime, t);

function setGeo(hw, hh, cx, cy, rot, flip, W, H){
  const c = Math.cos(rot), s = Math.sin(rot), d = [];

function drawFrame(i, local){
  if (!gl) return;
  const tp = i > 0 ? E._eng_trans_progress(i, local) : -1;
  if (tp >= 0) {
    const pi = i - 1;
    if (E._eng_clip_src(pi) !== E._eng_clip_src(i)) drawClipTo(fb[prevIdx], pi, E._eng_clip_len(pi) - 0.001);
    drawClipTo(fb[1-prevIdx], i, local);

/* ===================== Titles ===================== */
const easeOut = x => 1 - Math.pow(1 - x, 3);
const backOut = x => { const c = 1.70158; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
function drawTexts(){
  const W = tc.width, H = tc.height, n = E._eng_ov_count(), list = [];
  textBoxes = [];
  for (let k = 0; k < n; k++) {
    const id = E._eng_ov_id(k), st = E._eng_ov_start(id), du = E._eng_ov_dur(id);
    if (t >= st && t < st + du) list.push({id, st, du, lane: E._eng_ov_get(id, O.LANE)});
  }
  tctx.clearRect(0, 0, W, H);
  if (!list.length) return false;
  list.sort((a, b) => b.lane - a.lane);
  for (const it of list) {
    const id = it.id, g = k => E._eng_ov_get(id, k), text = ovText(id), local = t - it.st;
    const anim = g(O.ANIM) | 0, ein = clamp(local / 0.35, 0, 1), eout = clamp((it.du - local) / 0.35, 0, 1);
    let alpha = 1, sc = 1, dy = 0, shownLen = text.length;
    if (anim === 1) alpha = Math.min(ein, eout);
    if (anim === 2) { sc = ein < 1 ? Math.max(0.01, backOut(ein)) : 1; alpha = Math.min(1, ein*3, eout); }
    if (anim === 3) { dy = (1 - easeOut(ein)) * H * 0.06; alpha = Math.min(ein, eout); }
    if (anim === 4) { const cps = Math.max(12, text.length / Math.max(0.3, it.du * 0.6)); shownLen = Math.floor(local * cps); alpha = eout; }
    const size = Math.max(4, g(O.SIZE) * H), al = g(O.ALIGN) | 0, font = FONTS[g(O.FONT) | 0] || FONTS[0];
    tctx.save();
    tctx.font = `${g(O.BOLD) > 0.5 ? 800 : 500} ${size}px ${font[1]}`;
    tctx.textAlign = ["left","center","right"][al]; tctx.textBaseline = "middle"; tctx.lineJoin = "round";
    const lines = text.split("\n"), lh = size * 1.22, bh = lines.length * lh;
    const widths = lines.map(l => tctx.measureText(l).width), mw = Math.max(1, ...widths);
    const cx = g(O.X) * W, cy = g(O.Y) * H + dy, pad = size * 0.32;
    tctx.globalAlpha = alpha; tctx.translate(cx, cy); tctx.scale(sc, sc);
    const xFor = w => al === 0 ? 0 : al === 2 ? 0 : 0;
    const boxX = w => al === 0 ? -pad : al === 1 ? -w/2 - pad : -w - pad;
    if (g(O.BG) > 0.5) {
      tctx.fillStyle = rgba(g(O.BGCOLOR) | 0, g(O.BGOP));
      lines.forEach((l, li) => {
        const w = widths[li]; if (!w) return; const y = -bh/2 + lh*li;
        tctx.beginPath(); if (tctx.roundRect) tctx.roundRect(boxX(w), y - pad*0.15, w + pad*2, lh + pad*0.3, size*0.18); else tctx.rect(boxX(w), y - pad*0.15, w + pad*2, lh + pad*0.3);
        tctx.fill();
      });
    }
    let remain = shownLen;
    lines.forEach((l, li) => {
      const part = l.slice(0, Math.max(0, remain)); remain -= l.length + 1;
      if (!part) return;
      const y = -bh/2 + lh*(li + 0.5), x = xFor(widths[li]);
      if (al !== 1 && anim === 4) tctx.textAlign = al === 0 ? "left" : "right";
      if (g(O.SHADOW) > 0.5) { tctx.shadowColor = "rgba(0,0,0,.65)"; tctx.shadowBlur = size*0.25; tctx.shadowOffsetY = size*0.06; }
      if (g(O.OUTLINE) > 0.5) { tctx.lineWidth = size*0.14; tctx.strokeStyle = "#000"; tctx.strokeText(part, x, y); tctx.shadowColor = "transparent"; }
      tctx.fillStyle = hex(g(O.COLOR)); tctx.fillText(part, x, y); tctx.shadowColor = "transparent";
    });
    tctx.restore();
    const left = al === 0 ? cx : al === 1 ? cx - mw/2 : cx - mw;
    textBoxes.push({id, x0: left - pad, x1: left + mw + pad, y0: cy - bh/2 - pad, y1: cy + bh/2 + pad});
  }
  return true;
}

/* ===================== Audio graph & sources ===================== */
function ensureAudio(){
  if (actx) return;
  actx = new AudioContext(); adest = actx.createMediaStreamDestination();
  master = actx.createGain(); analyser = actx.createAnalyser(); analyser.fftSize = 512;
  master.connect(actx.destination); master.connect(adest); master.connect(analyser);
}
function kindOf(f){
  if (f.type.startsWith("video") || /\.(mp4|webm|mkv|mov|ogv|m4v|avi)$/i.test(f.name)) return "video";
  if (f.type.startsWith("audio") || /\.(mp3|wav|ogg|oga|m4a|aac|flac|opus)$/i.test(f.name)) return "audio";
  if (f.type.startsWith("image") || /\.(png|jpe?g|gif|webp|bmp|avif)$/i.test(f.name)) return "image";
  return null;
}
function addSource(file){
  ensureAudio();
  return new Promise(res => {
    const kind = kindOf(file); if (!kind) return res(-1);
    const url = URL.createObjectURL(file);
    if (kind === "image") {
      const img = new Image();
      img.onload = () => {
        const sid = E._eng_add_source(36000);
        const th = document.createElement("canvas"); th.height = 60; th.width = Math.max(20, Math.round(60 * img.naturalWidth / img.naturalHeight));
        th.getContext("2d").drawImage(img, 0, 0, th.width, th.height);
        sources[sid] = {name: file.name, kind, el: img, file, dur: 36000, w: img.naturalWidth, h: img.naturalHeight, frames: [th], peaks: null};
        res(sid);
      };
      img.onerror = () => { toast("Can't open image " + file.name, true); res(-1); };
      img.src = url; return;
    }
    const el = document.createElement(kind === "audio" ? "audio" : "video");
    el.preload = "auto"; el.playsInline = true; el.preservesPitch = true; el.src = url;
    el.addEventListener("loadedmetadata", () => {
      if (!isFinite(el.duration) || el.duration <= 0) { toast("Can't read duration of " + file.name, true); return res(-1); }
      const node = actx.createMediaElementSource(el), gain = actx.createGain(); gain.gain.value = 0;
      node.connect(gain); gain.connect(master);
      const sid = E._eng_add_source(el.duration);
      sources[sid] = {name: file.name, kind, el, file, dur: el.duration, w: el.videoWidth || 0, h: el.videoHeight || 0, gain, frames: [], peaks: null, pps: 100};
      if (kind === "video") makeFrames(sid);
      makePeaks(sid);
      res(sid);
    }, {once: true});
    el.addEventListener("error", () => { toast("Unsupported file: " + file.name, true); res(-1); }, {once: true});
  });
}
// Filmstrip thumbnails across the whole source.
function makeFrames(sid){
  const s = sources[sid], v = document.createElement("video"), N = 12; let k = 0;
  v.src = s.el.src; v.muted = true; v.preload = "auto";
  const next = () => { if (k >= N) { v.removeAttribute("src"); v.load(); return; } v.currentTime = Math.min(s.dur - 0.05, (k + 0.5) / N * s.dur); };
  v.addEventListener("loadeddata", next, {once: true});
  v.addEventListener("seeked", () => {
    const c = document.createElement("canvas"); c.height = 60; c.width = Math.round(60 * v.videoWidth / v.videoHeight) || 100;

// Audio peaks (100/s RMS) for waveforms and beat detection.
async function makePeaks(sid){
  const s = sources[sid];
  if (!s.file || s.file.size > 400e6) return;
  try {
    const buf = await actx.decodeAudioData(await s.file.arrayBuffer());
    const ch = [...Array(buf.numberOfChannels)].map((_, i) => buf.getChannelData(i));
    const block = Math.max(1, Math.floor(buf.sampleRate / 100)), n = Math.ceil(ch[0].length / block), pk = new Float32Array(n);
    let mx = 1e-6;
    for (let b = 0; b < n; b++) {
      let sum = 0, c = 0;
      for (let j = b*block, e = Math.min(ch[0].length, j + block); j < e; j += 2) { let v = 0; for (const d of ch) v += d[j]; v /= ch.length; sum += v*v; c++; }
      pk[b] = Math.sqrt(sum / Math.max(1, c)); if (pk[b] > mx) mx = pk[b];
    }
    for (let b = 0; b < n; b++) pk[b] /= mx;
    s.peaks = pk; s.pps = 100; renderTimeline();
  } catch (e) { /* no audio track */ }
}
function detectBeats(s, from, to){
  const pk = s.peaks; if (!pk) return [];
  const a = Math.floor(from * 100), b = Math.min(pk.length, Math.floor(to * 100)), flux = [];
  for (let i = a; i < b; i++) { let avg = 0; for (let j = 1; j <= 8; j++) avg += pk[Math.max(0, i - j)]; flux.push(Math.max(0, pk[i] - avg / 8)); }
  const out = []; let lastBeat = -1;
  for (let i = 1; i < flux.length - 1; i++) {
    let m = 0, sd = 0, c = 0;
    for (let j = Math.max(0, i - 50); j < Math.min(flux.length, i + 50); j++) { m += flux[j]; c++; }
    m /= c; for (let j = Math.max(0, i - 50); j < Math.min(flux.length, i + 50); j++) sd += (flux[j] - m) ** 2; sd = Math.sqrt(sd / c);
    if (flux[i] > m + 1.4*sd && flux[i] >= flux[i-1] && flux[i] >= flux[i+1] && flux[i] > 0.02 && (lastBeat < 0 || i - lastBeat > 28)) { out.push((a + i) / 100); lastBeat = i; }
  }

}

function frame(now){

      if (exporting) { t = tot; setPlaying(false); finishExport(); }
      else if (loop && tot > 0) t = 0;
      else { t = tot; setPlaying(false); }
    }
    if (t < 0) { t = 0; setPlaying(false); }
  }
  const i = E._eng_locate(t), local = E._eng_q_local(), srcT = E._eng_q_src();
  syncMedia(i, local, srcT);
  drawFrame(i, local);
  $("ph").style.left = (t * pps) + "px";
  $("time").textContent = fmt(t) + " / " + fmt(tot);
  $("empty").style.display = (E._eng_clip_count() || E._eng_ov_count() || E._eng_au_count()) ? "none" : "block";
  if (playing) { const sc = $("scroll"), x = t * pps; if (x > sc.scrollLeft + sc.clientWidth - 40 || x < sc.scrollLeft) sc.scrollLeft = x - 60; }
  if (exporting) { const p = clamp(t / Math.max(0.01, exporting.total), 0, 1); $("progBar").style.width = (p*100) + "%"; $("progP").textContent = Math.round(p*100) + "%"; }
  drawVU(); requestAnimationFrame(frame);
}
function syncMedia(i, local, srcT){
  const want = new Map(), mediaPlay = playing && shuttle > 0, rate = Math.abs(shuttle);
  if (i >= 0) {
    const s = E._eng_clip_src(i);
    want.set(s, {time: srcT, rate: E._eng_param_i(i, P.SPEED) * rate, gain: E._eng_param_i(i, P.VOLUME) * E._eng_fade(i, local), play: mediaPlay});
    if (i > 0 && E._eng_trans_progress(i, local) >= 0) {
      const ps = E._eng_clip_src(i - 1);
      if (ps !== s) want.set(ps, {time: Math.max(0, E._eng_clip_out(i - 1) - 0.04), rate: 1, gain: 0, play: false});
    }
  }
  const n = E._eng_au_count();
  for (let k = 0; k < n; k++) {
    const g = E._eng_au_gain(k, t); if (g < 0) continue;
    const s = E._eng_au_src_i(k); if (want.has(s)) continue;
    want.set(s, {time: E._eng_au_src_time(k, t), rate, gain: g, play: mediaPlay});

  sources.forEach((s, k) => {
    if (!s || s.kind === "image") return;
    const v = s.el, w = want.get(k);
    if (!w) { if (!v.paused) v.pause(); if (s.gain.gain.value !== 0) s.gain.gain.setTargetAtTime(0, actx.currentTime, 0.01); return; }
    s.gain.gain.setTargetAtTime(w.gain, actx.currentTime, 0.015);
    const r = clamp(w.rate, 0.0625, 16); if (Math.abs(v.playbackRate - r) > 0.001) v.playbackRate = r;
    const drift = Math.abs(v.currentTime - w.time);
    if (w.play) {

      if (v.paused) v.play().catch(() => {});

}

  playing = p; if (!p) shuttle = 1;

/* ===================== Import ===================== */
async function importFiles(list){

    try { await loadProject(JSON.parse(await projFile.text()), files.filter(f => f !== projFile)); }
    catch (e) { toast("That project file couldn't be opened", true); }
    return;
  }
  for (const f of files.filter(f => /\.(srt|vtt)$/i.test(f.name))) importSubs(await f.text());
  let added = 0;
  for (const f of files) {
    const kind = kindOf(f); if (!kind) continue;
    const sid = await addSource(f); if (sid < 0) continue;
    if (kind === "video") sel = {k: "clip", id: E._eng_add_clip(sid, 0)};
    else if (kind === "image") sel = {k: "clip", id: E._eng_add_clip(sid, 5)};
    else sel = {k: "audio", id: E._eng_au_add(sid, t, freeAudioLane(t, sources[sid].dur), 1)};

function freeAudioLane(start, dur){
  const n = E._eng_au_count();

      const s = E._eng_au_start(id), e = s + E._eng_au_out(id) - E._eng_au_in(id);

function parseTime(s){ const m = s.trim().replace(",", ".").split(":").map(Number); return m.length === 3 ? m[0]*3600 + m[1]*60 + m[2] : m[0]*60 + m[1]; }

    texts.push({start: E._eng_ov_start(id), dur: E._eng_ov_dur(id), q: [...Array(O.COUNT)].map((_, j) => E._eng_ov_get(id, j)), text: ovText(id)}); }
  for (let k = 0; k < E._eng_au_count(); k++) { const id = E._eng_au_id(k);

function resetAll(){

async function loadProject(data, files){

  const map = {}, missing = [];

const idb = {

    r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(this.db = r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ const db = await this.open(); return new Promise(res => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); },
  async set(k, v){ const db = await this.open(); return new Promise(res => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }); },

      E._eng_au_set_time(id, 0, inS, inS + vd); E._eng_au_set(id, A.FOUT, Math.min(3, vd / 4)); render(); return;
    }
  });
}
function labelFmt(key, v){
  const [kind, k] = key.split(":").map((x, i) => i ? +x : x);
  if (kind === "clip") { if (k === P.SPEED || k === P.SCALE) return SHOW.x(v); if (k === P.ROT) return SHOW.deg(v); if (k === P.PIXEL) return SHOW.px(v);
    if ([P.KB, P.OPACITY, P.VOLUME].includes(k)) return SHOW.pct(v); if ([P.FADEIN, P.FADEOUT, P.TRDUR].includes(k)) return SHOW.s(v); }
  if (kind === "text" && [O.SIZE, O.X, O.Y, O.BGOP].includes(k)) return SHOW.pct(v);
  if (kind === "audio") return k === A.VOL ? SHOW.pct(v) : SHOW.s(v);
  return f2(v);
}
function applyLook(id, name){
  E._eng_reset_params(id, 0, P.SPLIT + 1);
  Object.entries(LOOKS[name]).forEach(([k, v]) => E._eng_set_param(id, P[k], v));
}

/* ===================== Preview interaction ===================== */
function bindPreview(){
  const view = $("view");
  const toCanvas = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * cv.width, (e.clientY - r.top) / r.height * cv.height]; };
  view.addEventListener("pointerdown", e => {
    if (exporting) return;
    const [x, y] = toCanvas(e), W = cv.width, H = cv.height, r = cv.getBoundingClientRect();
    const hit = textBoxes.slice().reverse().find(b => x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1);
    let mv;
    if (hit) {
      select("text", hit.id); renderTimeline();
      const x0 = E._eng_ov_get(hit.id, O.X), y0 = E._eng_ov_get(hit.id, O.Y); E._eng_commit();
      mv = ev => { E._eng_ov_set(hit.id, O.X, clamp(x0 + (ev.clientX - e.clientX) / r.width, 0, 1)); E._eng_ov_set(hit.id, O.Y, clamp(y0 + (ev.clientY - e.clientY) / r.height, 0, 1)); };
    } else {
      const i = E._eng_locate(t); if (i < 0) return;
      const id = E._eng_clip_id(i); select("clip", id); renderTimeline();
      const px = E._eng_get_param(id, P.POSX), py = E._eng_get_param(id, P.POSY); let c = false;
      mv = ev => { if (!c) { E._eng_commit(); c = true; }
        E._eng_set_param(id, P.POSX, px + (ev.clientX - e.clientX) / r.width * 2); E._eng_set_param(id, P.POSY, py - (ev.clientY - e.clientY) / r.height * 2); };
    }
    const up = () => { removeEventListener("pointermove", mv); removeEventListener("pointerup", up); render(); };
    addEventListener("pointermove", mv); addEventListener("pointerup", up);
  });
  let wheelT = 0;
  view.addEventListener("wheel", e => {
    if (exporting || !sel) return; e.preventDefault();
    if (performance.now() - wheelT > 600) E._eng_commit(); wheelT = performance.now();
    const f = Math.exp(-e.deltaY * 0.0012);
    if (sel.k === "clip") E._eng_set_param(sel.id, P.SCALE, clamp(E._eng_get_param(sel.id, P.SCALE) * f, 0.1, 4));
    else if (sel.k === "text") E._eng_ov_set(sel.id, O.SIZE, clamp(E._eng_ov_get(sel.id, O.SIZE) * f, 0.015, 0.3));
    clearTimeout(view._rt); view._rt = setTimeout(() => render(), 250);
  }, {passive: false});
}
function drawScope(){
  if ($("scope").style.display !== "block") return;
  const sm = drawScope.c || (drawScope.c = document.createElement("canvas")); sm.width = 160; sm.height = 90;
  const x = sm.getContext("2d", {willReadFrequently: true}); x.drawImage(cv, 0, 0, 160, 90);
  const d = x.getImageData(0, 0, 160, 90).data, hr = new Uint32Array(64), hg = new Uint32Array(64), hb = new Uint32Array(64);
  for (let i = 0; i < d.length; i += 4) { hr[d[i] >> 2]++; hg[d[i+1] >> 2]++; hb[d[i+2] >> 2]++; }
  const sc = $("scope"), c = sc.getContext("2d"); c.clearRect(0, 0, sc.width, sc.height);
  const mx = Math.max(...hr, ...hg, ...hb) || 1; c.globalCompositeOperation = "lighter";
  [[hr, "rgba(255,70,70,.8)"], [hg, "rgba(70,255,110,.8)"], [hb, "rgba(80,140,255,.8)"]].forEach(([h, col]) => {
    c.fillStyle = col; c.beginPath(); c.moveTo(0, sc.height);
    for (let i = 0; i < 64; i++) c.lineTo(i * 4 + 2, sc.height - (h[i] / mx) * (sc.height - 8));
    c.lineTo(sc.width, sc.height); c.fill();
  });
  c.globalCompositeOperation = "source-over";
}

/* ===================== Edit actions ===================== */
function act(fn){ if (exporting) return; fn(); render(); }
function doSplit(){
  if (sel && sel.k === "audio" && E._eng_au_index(sel.id) >= 0) { const id = E._eng_au_split(sel.id, t); if (id > 0) sel.id = id; return; }
  if (sel && sel.k === "text" && E._eng_ov_index(sel.id) >= 0) { const id = E._eng_ov_split(sel.id, t); if (id > 0) sel.id = id; return; }
  const id = E._eng_split(t); if (id > 0) sel = {k: "clip", id};
}
function doDelete(){
  if (!validSel()) return;
  if (sel.k === "clip") E._eng_delete(sel.id); else if (sel.k === "text") E._eng_ov_delete(sel.id); else E._eng_au_delete(sel.id);
  sel = null;
}
function doDuplicate(){
  if (!validSel()) return; let id;
  if (sel.k === "clip") id = E._eng_duplicate(sel.id); else if (sel.k === "text") id = E._eng_ov_duplicate(sel.id); else id = E._eng_au_duplicate(sel.id);
  if (id > 0) sel.id = id;
}
function addText(){
  const id = E._eng_ov_add(t, 3, 1); setOvText(id, "Your text");
  Object.entries(TEXT_PRESETS["Title"]).forEach(([k, v]) => E._eng_ov_set(id, +k, v));
  sel = {k: "text", id}; setTimeout(() => { const el = $("txtEdit"); if (el) { el.focus(); el.select(); } }, 30);
}
function trimToPlayhead(side){
  const i = E._eng_locate(t); if (i < 0) return; const id = E._eng_clip_id(i), src = E._eng_q_src();
  E._eng_commit();
  if (side === "start") { E._eng_trim(id, src, E._eng_clip_out(i)); t = E._eng_clip_start(i); }
  else E._eng_trim(id, E._eng_clip_in(i), src);
  sel = {k: "clip", id};
}
async function freezeFrame(){
  if (exporting || !E._eng_clip_count()) return;
  const i = E._eng_locate(t); if (i < 0) return toast("Move the playhead over a clip first", true);
  skipText = true; drawFrame(i, E._eng_q_local()); skipText = false;
  const blob = await new Promise(r => cv.toBlob(r, "image/png"));
  const sid = await addSource(new File([blob], `Freeze ${fmt(t)}.png`, {type: "image/png"}));
  if (sid < 0) return;
  const id = E._eng_insert_clip(sid, t, 2); sel = {k: "clip", id}; render(); toast("Freeze frame inserted (2 s)");
}
function splitAtMarkers(){
  const n = E._eng_mark_count(); let c = 0;
  for (let k = 0; k < n; k++) if (E._eng_split(E._eng_mark_get(k)) > 0) c++;
  toast(c ? `Made ${c} cuts on the markers` : "No cuts made", !c);
}

/* ===================== Export ===================== */
const FORMATS = [["video/mp4;codecs=avc1.42E01E,mp4a.40.2","MP4 (H.264)","mp4"],["video/webm;codecs=vp9,opus","WebM (VP9)","webm"],["video/webm;codecs=vp8,opus","WebM (VP8)","webm"],["video/webm;codecs=h264,opus","WebM (H.264)","webm"],["video/webm","WebM","webm"]];
function openExport(){
  if (!total()) return;
  const sup = FORMATS.filter(f => window.MediaRecorder && MediaRecorder.isTypeSupported(f[0]));
  $("exFmt").innerHTML = sup.map((f, i) => `<option value="${i}">${f[1]}</option>`).join("");
  $("exFmt")._list = sup; $("exRes").value = String(proj.res); $("exFps").value = String(proj.fps);
  updateExInfo(); $("dlgExport").showModal();
}
function updateExInfo(){
  const [w, h] = projSize(+$("exRes").value), br = bitrate(w, h);
  $("exInfo").textContent = `${w}×${h} · ${(br/1e6).toFixed(1)} Mbps · ≈${Math.round(br * total() / 8 / 1e6)} MB · takes ${fmt(total(), true)}`;
}
const bitrate = (w, h) => Math.round(w * h * +$("exFps").value * 0.12 * +$("exQ").value);
async function startExport(audioOnly){
  if (exporting || !total()) return;
  $("dlgExport").close(); ensureAudio(); setPlaying(false);
  const list = $("exFmt")._list || [], fmtSel = list[+$("exFmt").value] || ["video/webm", "WebM", "webm"];
  proj.res = +$("exRes").value; proj.fps = +$("exFps").value;
  applyCanvasSize(true);
  const fps = proj.fps, [w, h] = [cv.width, cv.height];
  let stream, mime, ext;
  if (audioOnly) { stream = adest.stream; mime = ["audio/webm;codecs=opus", "audio/webm"].find(m => MediaRecorder.isTypeSupported(m)); ext = "webm"; }
  else { stream = new MediaStream([...cv.captureStream(fps).getVideoTracks(), ...adest.stream.getAudioTracks()]); mime = fmtSel[0]; ext = fmtSel[2]; }
  const rec = new MediaRecorder(stream, audioOnly ? {mimeType: mime, audioBitsPerSecond: 256000} : {mimeType: mime, videoBitsPerSecond: bitrate(w, h), audioBitsPerSecond: 192000});
  const chunks = [], name = ($("exName").value || "cutline-export").replace(/[\\/:*?"<>|]/g, "_");
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const ok = exporting && !exporting.cancelled;
    if (ok) download(new Blob(chunks, {type: mime.split(";")[0]}), `${name}${audioOnly ? "-audio" : ""}.${ext}`);
    $("prog").style.display = "none"; exporting = null; setBusy(false); applyCanvasSize(false); render(false);
    toast(ok ? "Export finished" : "Export cancelled", !ok);
  };
  exporting = {rec, total: total(), cancelled: false}; setBusy(true);
  $("progT").textContent = audioOnly ? "Exporting audio…" : `Exporting ${w}×${h} ${fmtSel[1]}…`; $("prog").style.display = "block";
  t = 0; syncMedia(E._eng_locate(0), 0, E._eng_q_src());
  setTimeout(() => { rec.start(500); setPlaying(true); }, 500);
}
function finishExport(){ setTimeout(() => exporting && exporting.rec.state !== "inactive" && exporting.rec.stop(), 400); }
function cancelExport(){ if (!exporting) return; exporting.cancelled = true; setPlaying(false); exporting.rec.stop(); }
function setBusy(b){ document.querySelectorAll("header button, header select, #tlbar button").forEach(x => x.disabled = b); if (!b) updateButtons(); }
function snapshotPNG(){
  skipText = false; drawFrame(E._eng_locate(t), E._eng_q_local());
  cv.toBlob(b => download(b, `frame-${fmt(t).replace(/[:.]/g, "-")}.png`), "image/png");
}

/* ===================== Bindings ===================== */
const SHORTCUTS = [["Space","Play / pause"],["J / K / L","Reverse · stop · fast-forward (press again for faster)"],["← / →","Step one frame (Shift: 1 second)"],["↑ / ↓","Previous / next edit point"],["Home / End","Go to start / end"],
  ["S","Split at playhead (selected audio/text, otherwise video)"],["Q / W","Trim clip start / end to playhead"],["Delete","Delete selection (ripple)"],["D","Duplicate selection"],["T","Add text"],["M","Toggle marker"],
  ["Shift+F","Freeze frame"],["F","Fullscreen preview"],["N","Toggle snapping"],["+ / −","Zoom timeline"],["\\","Zoom to fit"],["I","Import media"],["Ctrl+Z / Ctrl+Y","Undo / redo"],["Ctrl+S","Save project"],["Ctrl+O","Open project"],["Ctrl+E","Export"],["Esc","Deselect"],["?","This help"]];
function bindUI(){
  bindInspector(); bindPreview();
  $("helpList").innerHTML = SHORTCUTS.map(([k, d]) => `<kbd>${esc(k)}</kbd><span>${esc(d)}</span>`).join("");
  $("bImport").onclick = () => $("file").click();
  $("bOpen").onclick = () => { toast("Choose the project file together with its media files"); $("file").click(); };
  $("file").onchange = e => { importFiles(e.target.files); e.target.value = ""; };
  $("bSave").onclick = saveProject;
  $("bNew").onclick = () => { if ((E._eng_clip_count() || E._eng_ov_count() || E._eng_au_count()) && !confirm("Start a new project? Unsaved changes will be lost.")) return; resetAll(); render(); };
  $("bText").onclick = () => act(addText);
  $("bPlay").onclick = () => { shuttle = 1; setPlaying(!playing); };
  $("bStart").onclick = () => { t = 0; };
  $("bPrev").onclick = () => { t = E._eng_next_point(t, -1); };
  $("bNext").onclick = () => { t = E._eng_next_point(t, 1); };
  $("bLoop").onclick = () => { loop = !loop; $("bLoop").classList.toggle("on", loop); };
  $("bSplit").onclick = () => act(doSplit);
  $("bDel").onclick = () => act(doDelete);
  $("bDup").onclick = () => act(doDuplicate);
  $("bUndo").onclick = () => act(() => E._eng_undo());
  $("bRedo").onclick = () => act(() => E._eng_redo());
  $("bFreeze").onclick = freezeFrame;
  $("bExport").onclick = openExport;
  $("bHelp").onclick = () => $("dlgHelp").showModal();
  $("exGo").onclick = () => startExport(false);
  $("exAudio").onclick = () => startExport(true);
  $("exPng").onclick = snapshotPNG;
  $("exSrt").onclick = exportSubs;
  $("exClose").onclick = () => $("dlgExport").close();
  ["exRes", "exFps", "exQ"].forEach(id => $(id).onchange = updateExInfo);
  $("bCancelExp").onclick = cancelExport;
  $("bMagnet").onclick = () => { snapOn = !snapOn; $("bMagnet").classList.toggle("on", snapOn); };
  $("bMark").onclick = () => act(() => E._eng_mark_toggle(t, 6 / pps));
  $("bSplitMarks").onclick = () => act(splitAtMarkers);
  $("bClearMarks").onclick = () => act(() => E._eng_mark_clear());
  $("bFit").onclick = fitTimeline;
  $("bGuides").onclick = () => { const g = $("guides"), on = g.style.display !== "block"; g.style.display = on ? "block" : "none"; $("bGuides").classList.toggle("on", on); };
  $("bGrid").onclick = () => { const g = $("grid"), on = g.style.display !== "block"; g.style.display = on ? "block" : "none"; $("bGrid").classList.toggle("on", on); };
  $("bScope").onclick = () => { const g = $("scope"), on = g.style.display !== "block"; g.style.display = on ? "block" : "none"; $("bScope").classList.toggle("on", on); };
  setInterval(drawScope, 200);
  $("bSnap").onclick = snapshotPNG;
  $("bFull").onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else $("view").requestFullscreen().catch(() => {}); };
  document.addEventListener("fullscreenchange", () => setTimeout(fitView, 50));
  $("zoom").oninput = e => { pps = +e.target.value; renderTimeline(); };
  $("track").addEventListener("pointerdown", e => {
    if (exporting) return;
    seekTo(e); if (sel) { sel = null; renderInspector(); renderTimeline(); updateButtons(); }
    const mv = ev => seekTo(ev), up = () => { removeEventListener("pointermove", mv); removeEventListener("pointerup", up); };
    addEventListener("pointermove", mv); addEventListener("pointerup", up);
  });
  $("scroll").addEventListener("wheel", e => {
    if (e.ctrlKey) { e.preventDefault(); const sc = $("scroll"), r = sc.getBoundingClientRect(), tm = (e.clientX - r.left + sc.scrollLeft) / pps;
      pps = clamp(pps * Math.exp(-e.deltaY * 0.002), 4, 400); $("zoom").value = pps; renderTimeline(); sc.scrollLeft = tm * pps - (e.clientX - r.left); }
    else if (!e.shiftKey && Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); $("scroll").scrollLeft += e.deltaY; }
  }, {passive: false});
  // Drag & drop
  let dragDepth = 0;
  addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; $("drop").style.display = "flex"; });
  addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("drop").style.display = "none"; } });
  addEventListener("dragover", e => e.preventDefault());
  addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; $("drop").style.display = "none"; if (!exporting && e.dataTransfer.files.length) importFiles(e.dataTransfer.files); });
  addEventListener("beforeunload", () => { if (dirty) autosave(); });
  addEventListener("keydown", onKey);
}
function onKey(e){
  if (e.target.matches("input,textarea,select")) { if (e.key === "Escape") e.target.blur(); return; }
  if (exporting) { if (e.key === "Escape") cancelExport(); return; }
  const k = e.key, ctrl = e.ctrlKey || e.metaKey, step = 1 / proj.fps;
  const done = () => e.preventDefault();
  if (ctrl) {
    const kl = k.toLowerCase();
    if (kl === "z" && !e.shiftKey) { act(() => E._eng_undo()); return done(); }
    if (kl === "y" || (kl === "z" && e.shiftKey)) { act(() => E._eng_redo()); return done(); }
    if (kl === "s") { saveProject(); return done(); }
    if (kl === "o") { $("bOpen").click(); return done(); }
    if (kl === "e") { openExport(); return done(); }
    if (kl === "d") { act(doDuplicate); return done(); }
    return;
  }
  switch (k) {
    case " ": shuttle = 1; setPlaying(!playing); return done();
    case "l": case "L": if (playing && shuttle > 0) shuttle = Math.min(8, shuttle * 2); else { shuttle = 1; setPlaying(true); } setPlaying(true); return done();
    case "j": case "J": if (playing && shuttle < 0) shuttle = Math.max(-8, shuttle * 2); else shuttle = -1; playing = true; $("bPlay").textContent = "◀ ×" + (-shuttle); return done();
    case "k": case "K": setPlaying(false); return done();
    case "ArrowLeft": setPlaying(false); t = Math.max(0, t - (e.shiftKey ? 1 : step)); return done();
    case "ArrowRight": setPlaying(false); t = Math.min(total(), t + (e.shiftKey ? 1 : step)); return done();
    case "ArrowUp": t = E._eng_next_point(t, -1); return done();
    case "ArrowDown": t = E._eng_next_point(t, 1); return done();
    case "Home": t = 0; return done();
    case "End": t = total(); return done();
    case "s": case "S": act(doSplit); return done();
    case "q": case "Q": act(() => trimToPlayhead("start")); return done();
    case "w": case "W": act(() => trimToPlayhead("end")); return done();
    case "Delete": case "Backspace": act(doDelete); return done();
    case "d": case "D": act(doDuplicate); return done();
    case "t": case "T": act(addText); return done();
    case "m": case "M": act(() => E._eng_mark_toggle(t, 6 / pps)); return done();
    case "n": case "N": $("bMagnet").click(); return done();
    case "f": if (!e.shiftKey) { $("bFull").click(); return done(); } break;
    case "F": freezeFrame(); return done();
    case "i": case "I": $("file").click(); return done();
    case "+": case "=": pps = clamp(pps * 1.25, 4, 400); $("zoom").value = pps; renderTimeline(); return done();
    case "-": case "_": pps = clamp(pps / 1.25, 4, 400); $("zoom").value = pps; renderTimeline(); return done();
    case "\\": fitTimeline(); return done();
    case "?": $("dlgHelp").showModal(); return done();
    case "Escape": sel = null; render(false); return done();
  }
}
